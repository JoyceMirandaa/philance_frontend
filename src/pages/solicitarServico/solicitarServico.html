<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Solicitar Serviço</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/solicitarServico.css">
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <main>

        <div id="space-navbar"></div>

        <div class="solicitar-container">
            <form id="solicitarForm">
                <section class="infos">
                    <!-- Tags -->
                    <div class="inputs">
                        <label for="tags">Categoria / Tag do Serviço:</label>
                        <select id="tags" name="tags" required>
                            <option value="">Carregando tags...</option>
                        </select>
                    </div>
                
                    <div class="inputs">
                        <label for="rua">Escolha o Endereço:</label>
                        <select id="rua">
                            <option value="">Selecione o endereço...</option>
                        </select>
                    </div>

                    <div class="inputs">
                        <label for="title-horario" >Horário do Início</label>
                        <input type="datetime-local" id="inicio">
                    </div>

                    <div class="inputs">
                        <label for="title-horario" >Horário de Término</label>
                        <input type="datetime-local" id="termino">
                    </div>

                    <div class="inputs">
                        <label for="title-idade" >Idade Mínima</label>
                        <input type="number" id="min_age" placeholder="Insira idade mínima">
                    </div>

                    <div class="inputs">
                        <label for="title-pagamento" >Valor do Pagamento</label>
                        <input type="number" id="payment">
                    </div>

                    <!-- Vestimenta -->
                    <div class="inputs">
                        <label for="title-vestimenta">Vestimenta Exigida</label>
                        <div class="vestimenta-buttons">
                            <!-- Opção 1 (Já inicia marcada por padrão com 'checked') -->
                            <input type="radio" id="vestimenta-social" name="vestimenta" value="social" checked>
                            <label for="vestimenta-social">Traje Social Escuro</label>

                            <!-- Opção 2 -->
                            <input type="radio" id="vestimenta-casual" name="vestimenta" value="casual">
                            <label for="vestimenta-casual">Casual</label>

                            <input type="radio" id="vestimenta-normal" name="vestimenta" value="normal">
                            <label for="vestimenta-normal">Sem Restrições</label>
                        </div>
                    </div>

                    <div class="inputs">
                        <label for="title-descricao">Descrição Serviço</label>
                        <textarea id="description" placeholder="Descreva os detalhes do trabalho..."></textarea>
                    </div>

                    <div class="buttons">
                        <a href="/src/pages/Home/empresa/home.html">
                            <button type="button" class="btn btn-light">Voltar</button>
                        </a>
                        <button class="btn btn-dark" onclick="enviarDadosParaOBackendSolicitar(event, 'vestimenta')">Publicar Serviço</button>
                    </div>
                </section>
            </div>
        </div>

        </div>
        <script src="/src/pages/solicitarServico/solicitarServico.js"></script>
        <script>
            document.querySelectorAll('.tags-buttons input[type="radio"]').forEach(radio => {
                radio.addEventListener('click', function() {
                    if (this.wasChecked) {
                        this.checked = false;
                        this.wasChecked = false;
                    } else {
                        // Remove o estado antigo dos outros do mesmo grupo
                        document.querySelectorAll(`input[name="${this.name}"]`).forEach(r => r.wasChecked = false);
                        this.wasChecked = true;
                    }
                });
            });
        </script>
    </main>
</body>
<script src="/src/componentes/navbar/navbar.js"></script>
<script>
    carregarNavbarHomeEmpresa();

</script>
</html>
