<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Solicitar Serviço</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/solicitarServico.css">
</head>
<body>
    <div id="space-navbar"></div>
    <div class="background">
        <div class="container-form">
            <div class="infos">
                <!-- Tags -->
                <div class="form-group">
                    <label for="tags">Categoria / Tag do Serviço:</label>
                    <select id="tags" name="tags" required>
                        <option value="">Carregando tags...</option>
                    </select>
                </div>
            
                <!-- Endereço -->
                <label for="rua">Escolha o endereço:</label>
                <select id="rua">
                    <option value="">Selecione o endereço...</option>
                </select>

                <!-- Horário e Idade -->
                <section class="horario-idade">
                    <div class="horario-dia">
                        <div class="horario">
                            <h2 class="title-horario" >Horário do Início</h2>
                            <input type="datetime-local" id="inicio" class="input-horario">
                        </div>
                    </div>

                    <div class="horario-dia">
                        <div class="horario">
                            <h2 class="title-horario" >Horário de Termino</h2>
                            <input type="datetime-local" id="termino" class="input-horario">
                        </div>
                    </div>

                    <div class="idade-minima">
                        <div class="idade">
                            <h2 class="title-idade" >Idade Mínima</h2>
                            <input type="number" id="min_age" class="input-idade" required>
                        </div>
                    </div>
                </section>

                <!-- Duração e Pagamento -->
                <section class="duracao-pagamento">
                    <div class="pagamento-container">
                        <div class="pagamento">
                            <h2 class="title-pagamento" >Valor do Pagamento</h2>
                            <input type="number" id="payment" class="input-pagamento" required>
                        </div>
                    </div>
                </section>

                <!-- Vestimenta -->
                <section class="type-vestimenta">
                    <h3 class="title-vestimenta">Vestimenta Exigida</h3>
                    <div class="vestimenta-buttons">
                        <!-- Opção 1 (Já inicia marcada por padrão com 'checked') -->
                        <input type="radio" id="vestimenta-social" name="vestimenta" value="social" checked>
                        <label for="vestimenta-social">Traje Social Escuro</label>

                        <!-- Opção 2 -->
                        <input type="radio" id="vestimenta-casual" name="vestimenta" value="casual">
                        <label for="vestimenta-casual">Casual</label>

                        <input type="radio" id="vestimenta-normal" name="vestimenta" value="normal">
                        <label for="vestimenta-normal">Sem Restrições</label>
                    </div>
                </section>
 
                <!-- Descrição -->
                <section class="descricao">
                    <h3 class="title-descricao">Descrição Serviço</h3>
                    <textarea class="input-descricao" id="description" placeholder="Descreva os detalhes do trabalho..."></textarea>
                </section>

                <button class="btn btn-dark" onclick="enviarDadosParaOBackendSolicitar(event, 'vestimenta')">Publicar Serviço</button>
            </div>
        </div>
    </div>

    </div>
    <script src="/src/pages/solicitarServico/solicitarServico.js"></script>
    <script>
        document.querySelectorAll('.tags-buttons input[type="radio"]').forEach(radio => {
            radio.addEventListener('click', function() {
                if (this.wasChecked) {
                    this.checked = false;
                    this.wasChecked = false;
                } else {
                    // Remove o estado antigo dos outros do mesmo grupo
                    document.querySelectorAll(`input[name="${this.name}"]`).forEach(r => r.wasChecked = false);
                    this.wasChecked = true;
                }
            });
        });
    </script>
    
</body>
<script src="/src/componentes/navbar/navbar.js"></script>
<script>
    carregarNavbarHomeEmpresa();

</script>
</html>
