<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Home</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/css/homeEmpresa.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="space-navbar"></div>
    <!-- Banner -->
    <section class="banner">
        <div class="banner-interior">
            <div class="banner-text">
                <h1>Bem vindo de volta<br id="username"></br></h1>
                <p>Solicite um novo serviço de freelancer</p>
                <a href="/src/pages/solicitarServico/solicitarServico.html">
                    <button class="btn btn-outline">Solicitar serviço<i class="fa-solid fa-arrow-right icon-arrow"></i></button>
                </a>
            </div>
        </div>
        <div class="banner-wave" aria-hidden="true"></div>
    </section>

    <!-- Estatísticas -->
    <section class="estatisticas">

        <!-- Avaliações -->
        <article class="estatistica-card">
            <div class="estatistica-head card-head">
                <div class="avalia">
                    <h3>Avaliações</h3>
                    <span class="backg">1.460</span>
                </div>
                    <div class="avaliacao-valor">
                        <i class="fa-solid fa-star"></i>
                        <span class="avaliacao-numero">4.8</span>
                    </div>
            </div>
        </article>


        <!-- Relatório de Serviços -->
        <article class="estatistica-card ">
            <h3 class="grafico-titulo">Relatório de Serviços</h3>
            <canvas class="grafico" id="meuGrafico"></canvas>
        </article>

    </section>

    <!-- Serviços publicados -->
    <section class="servicos-aceitos">
        <div class="servicos-aceitos-head">
            <h2>Serviços Publicados</h2>
            <span class="contador-badge">4</span>
        </div>

        <div class="servico-lista" id="areaFinalizar">
        </div>
    </section>

    <script src="/src/pages/Home/empresa/home.js"></script>

</body>
    <script src="/src/componentes/navbar/navbar.js"></script>
<script>
     carregarNavbarHomeEmpresa();
</script>
<script>
    // Executa assim que a página e todos os scripts carregarem completamente
    window.addEventListener('load', function() {
        // Força a rolagem no HTML e no BODY tirando qualquer trava
        document.documentElement.style.setProperty('overflow-y', 'auto', 'important');
        document.body.style.setProperty('overflow-y', 'auto', 'important');
        
        // Remove travas de altura restrita se algum script tiver colocado
        document.documentElement.style.setProperty('height', 'auto', 'important');
        document.body.style.setProperty('height', 'auto', 'important');
        
        console.log("Rolagem liberada à força!");
    });
</script>
</html>
