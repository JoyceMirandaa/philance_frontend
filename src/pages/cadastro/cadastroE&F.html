<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Cadastro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/cadastroLogin.css">
</head>
<body>

    <main class="cadastro-container">
        
        <!-- Switch -->
        <div class="switch-container">
            <button type="button" class="switch-btn ativo" data-tipo="F">Sou freelancer</button>
            <button type="button" class="switch-btn" data-tipo="E">Sou empresa</button>
        </div>
        
        <div class="title-description">
            <h2>Cadastre-se</h2>
            <p>Preencha as informações para criar a sua conta</p>
        </div>

        <form id="formCadastro">
            <input type="hidden" id="letra-cadastro" name="tipo_usuario" value="F">

            <!-- Dados Pessoais -->
            <div class="inputs">
                <label for="username">Nome Completo:</label>
                <input id="username" type="text" placeholder="Digite seu nome completo" required>
            </div>

            <div class="inputs">
                <label for="date">Data de Nascimento:</label>
                <input type="date" id="date" required>
            </div>

            <div class="inputs">
                <label for="email">Email:</label>
                <input id="email" type="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="inputs">
                <label for="password">Senha:</label>
                <input id="password" type="password" placeholder="••••••••" required>
            </div>

            <div class="inputs">
                <label for="confirm-password">Confirmar Senha:</label>
                <input id="confirm-password" type="password" placeholder="••••••••" required>
            </div>

            <div class="inputs">
                <label for="phone">Telefone:</label>
                <input id="phone" type="tel" placeholder="(00) 00000-0000" required>
            </div>

            <!-- (CPF / CNPJ) -->
            <div id="campos-freelancer-cadastro" class="secao-cadastro inputs">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div id="campos-empresa-cadastro" class="secao-cadastro escondido inputs">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
            </div>

            <!-- Endereço -->
            <h3>Endereço</h3>

            <div class="inputs">
                <label for="cep">CEP:</label>
                <input id="cep" type="text" placeholder="00000-000" required>
            </div>

            <!-- Grid para Rua, Número e Complemento -->
            <div class="rua-grid">
                <div class="rua-field">
                    <label for="rua">Rua:</label>
                    <input id="rua" type="text" placeholder="Nome da rua" required>
                </div>

                <div class="rua-field">
                    <label for="numero">Número:</label>
                    <input id="numero" type="text" placeholder="123" required>
                </div>

                <div class="rua-field">
                    <label for="complemento">Complemento:</label>
                    <input id="complemento" type="text" placeholder="Apt / Bloco">
                </div>
            </div>

            <div class="inputs">
                <label for="bairro">Bairro:</label>
                <input id="bairro" type="text" placeholder="Seu bairro" required>
            </div>

            <div class="inputs">
                <label for="cidade">Cidade:</label>
                <input id="cidade" type="text" placeholder="Sua cidade" required>
            </div>

            <div class="inputs">
                <label for="estado">Estado:</label>
                <input id="estado" type="text" placeholder="UF" required>
            </div>

            <button class="btn btn-dark" id="btnCadastrar" type="submit">Criar conta</button>
        </form>

        <p class="login-link">
            Já tem conta? <a class="facaLogin" href="/src/pages/login/loginE&F.html">Faça login</a>
        </p>

    </main>

    <script type="module" src="/src/pages/cadastro/cadastroE&F.js"></script>
</body>
</html>
