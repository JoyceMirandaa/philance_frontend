<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Cadastro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>

    <main class="cadastro-container">
        
        <!-- Switch -->
        <div class="switch-container">
            <button type="button" class="switch-btn ativo" data-tipo="F">Sou freelancer</button>
            <button type="button" class="switch-btn" data-tipo="E">Sou empresa</button>
        </div>
        
        <div class="title-description">
            <h2>Cadastre-se</h2>
            <p>Preencha as informações para criar a sua conta</p>
        </div>

        <form id="cadastroForm">
            <input type="hidden" id="letra-cadastro" name="tipo_usuario" value="F">

            <!-- DADOS PESSOAIS -->
            <section class="step active" id="step1">
                <h3>Dados Pessoais</h3>
                <div class="inputs">
                    <label for="username">Nome Completo:</label>
                    <input id="username" type="text" placeholder="Digite seu nome completo" required>
                    <div id="mensagem-nome" class="mensagem-css"></div>
                </div>

                <div id="campo-data-freelancer-cadastro" class="secao-cadastro inputs">
                    <label for="date">Data de Nascimento</label>
                    <input type="date" id="date-nascimento" required>
                    <div id="mensagem-birthday" class="mensagem-css"></div>
                </div>
                
                <div id="campo-data-empresa-cadastro" class="secao-cadastro escondido inputs">
                    <label for="date">Data de Criação da Empresa</label>
                    <input type="date" id="date-criacao" required>
                    <div id="mensagem-criacao" class="mensagem-css"></div>
                </div>

                <div class="inputs">
                    <label for="email">Email:</label>
                    <input id="email" type="email" placeholder="seuemail@exemplo.com" required>
                    <div id="mensagem-email" class="mensagem-css"></div>
                </div>

                <div class="inputs">
                    <label for="phone">Telefone:</label>
                    <input id="phone" type="tel" placeholder="(00) 00000-0000" required>
                    <div id="mensagem-phone" class="mensagem-css"></div>
                </div>

                <!-- (CPF / CNPJ) -->
                <div id="campo-cpf-freelancer-cadastro" class="secao-cadastro inputs">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                    <div id="mensagem-cpf" class="mensagem-css"></div>
                </div>
            
                <div id="campo-cnpj-empresa-cadastro" class="secao-cadastro escondido inputs">
                    <label for="cnpj">CNPJ:</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0001-00" maxlength="18">
                    <div id="mensagem-cnpj" class="mensagem-css"></div>
                </div>

                <div class="inputs">
                    <label for="password">Senha:</label>
                    <input id="password" type="password" placeholder="••••••••" required>
                    <div id="mensagem-password" class="mensagem-css"></div>
                </div>

                <div class="inputs">
                    <label for="confirm-password">Confirmar Senha:</label>
                    <input id="confirm-password" type="password" placeholder="••••••••" required>
                    <div id="mensagem-confirm-password" class="mensagem-css"></div>
                </div>

                <div id="campo-sobre-freelancer-cadastro" class="secao-cadastro inputs">
                    <label for="sobre">Sobre Você:</label>
                    <textarea id="sobre" placeholder="Fale sobre você"></textarea>
                </div>

                <div id="campo-sobre-empresa-cadastro" class="secao-cadastro escondido inputs">
                    <label for="sobre">Sobre a Empresa:</label>
                    <textarea id="sobre" placeholder="Fale sobre a empresa"></textarea>
                </div>

                <div class="buttons">
                    <a href="/src/index.html">
                        <button type="button" class="btn btn-light">Voltar</button>
                    </a>
                        <button type="button" class="btn btn-dark" onclick="nextStep(2)">Avançar</button>
                </div>    
            </section>

            <!-- ENDEREÇO -->
            <section class="step" id="step2">
                <h3>Endereço</h3>

                <div class="inputs">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                </div>
            
                <div class="rua-grid">
                    <div class="rua-field">
                        <label for="rua">Rua:</label>
                        <input id="rua" type="text" placeholder="Nome da rua" required>
                    </div>

                    <div class="rua-field">
                        <label for="numero">Número:</label>
                        <input id="numero" type="text" placeholder="123" required>
                    </div>

                    <div class="rua-field">
                        <label for="complemento">Complemento:</label>
                        <input id="complemento" type="text" placeholder="Apt / Bloco">
                    </div>
                </div>

                <div class="inputs">
                    <label for="bairro">Bairro:</label>
                    <input id="bairro" type="text" placeholder="Seu bairro" required>
                </div>

                <div class="inputs">
                    <label for="cidade">Cidade:</label>
                    <input id="cidade" type="text" placeholder="Sua cidade" required>
                </div>

                <div class="inputs">
                    <label for="estado">Estado:</label>
                    <input id="uf" type="text" placeholder="UF" required>
                </div>

                <!-- Botões  -->
                <div class="buttons">
                    <button type="button" class="btn btn-light" onclick="nextStep(1)">Voltar</button>
                    <button type="button" class="btn btn-dark" onclick="nextStep(3)">Avançar</button>
                </div>
            </section>

            <!-- FOTO DE PERFIL -->
            <!-- <section class="step" id="step3">
                <h3>Foto de Perfil</h3>
                
                <div class="inputs">
                    <label for="avatar">Anexe a sua foto de perfil</label>
                    <input type="file" id="avatar" accept="image/*">
                </div>

                <div class="buttons">
                    <button type="button" class="btn btn-light" onclick="nextStep(2)">Voltar</button>
                    <button class="btn btn-dark" id="btnCadastro" type="submit">Cadastre-se</button>
                </div>
            </section>  -->

            <!-- Tags -->
            <section class="step" id="step3">
                <h3>Tags</h3>

                <div class="inputs">
                    <div class="tags-buttons">
                        <input type="radio" id="garcom" name="tags" value="garcom">
                        <label for="garcom">Garçom</label>

                        <input type="radio" id="atendente" name="tags" value="atendente">
                        <label for="atendente">Atendente</label>
                
                        <input type="radio" id="barista" name="tags" value="barista">
                        <label for="barista">Barista</label>
                
                        <input type="radio" id="seguranca" name="tags" value="seguranca">
                        <label for="seguranca">Segurança</label>
                
                        <input type="radio" id="bombeiroCivil" name="tags" value="bombeiroCivil">
                        <label for="bombeiroCivil">Bombeiro Civil</label>
                
                        <input type="radio" id="cozinheiro" name="tags" value="cozinheiro">
                        <label for="cozinheiro">Cozinheiro</label>

                        <input type="radio" id="auxiliarDeCozinha" name="tags" value="auxiliarDeCozinha">
                        <label for="auxiliarDeCozinha">Auxiliar De Cozinha</label>

                        <input type="radio" id="organizadorDeEventos" name="tags" value="organizadorDeEventos">
                        <label for="organizadorDeEventos">Organizador De Eventos</label>
                
                        <input type="radio" id="maridoDeAluguel" name="tags" value="maridoDeAluguel">
                        <label for="maridoDeAluguel">Marido de Aluguel</label>
                
                        <input type="radio" id="ServiçoDeEntregas" name="tags" value="sevicoDeEntregas">
                        <label for="servicoDeEntregas">Serviço de Entregas</label>
                
                        <input type="radio" id="faxineiro" name="tags" value="faxineiro">
                        <label for="faxineiro">Faxineiro</label>
                
                        <input type="radio" id="pedreiro" name="tags" value="pedreiro">
                        <label for="pedreiro">Pedreiro</label>
                        
                        <input type="radio" id="jardineiro" name="tags" value="jardineiro">
                        <label for="jardineiro">Jardineiro</label>
                    </div>
                </div>

                <div class="buttons">
                    <button type="button" class="btn btn-light" onclick="nextStep(2)">Voltar</button>
                    <button class="btn btn-dark" id="btnCadastro" type="submit">Cadastrar</button>
                </div>
            </section>

        </form>

        <p class="login-link">
            Já tem conta? <a class="facaLogin" href="/src/pages/login/loginE&F.html">Faça login</a>
        </p>
    </main>

    <script type="module" src="/src/pages/cadastro/cadastroE&F.js"></script>
</body>
</html>
