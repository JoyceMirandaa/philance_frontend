<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philance | Editar Perfil</title>
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/editarPerfil.css">
</head>
<body>
    <div id="space-navbar"></div>

    <section class="banner">
        <div class="banner-wave" aria-hidden="true"></div>
    </section>

    <form id="form-editar-perfil">

        <!-- Profile -->
        <div class="profile-container">
            <section class="profile-header">
                <div class="brand-group">
                    <div class="profile-avatar">
                        <label for="file-input">
                            <!-- Imagem de perfil atual (padrão) -->
                            <img id="profile-pic" src="/assets/imagens/building.png" alt="Foto de Perfil">
                            <div class="overlay">Alterar</div>
                        </label>
                        
                        <input type="file" id="file-input" accept="image/*" style="display: none;">
                    </div>

                    <div class="profile-title">
                        <a class="profile-name">Italy Caffe</a>
                        <a class="location">Curitiba, PR</a>
                    </div>
                </div>
            </section>
            <hr class="linha-solid">

            <h2>Dados Pessoais</h2>

            <section class="personal">
                
                <div class="inputs">
                    <label for="username">Nome:</label>
                    <input id="username" type="text" required>
                </div>

                <div class="inputs">
                    <label for="email">Email:</label>
                    <input id="email" type="email" required>
                </div>

                <div class="inputs">
                    <label for="password">Senha:</label>
                    <input id="password" type="password" required> 
                </div>

                <div class="inputs">
                    <label for="phone">Telefone:</label>
                    <input id="phone" type="tel" required>
                </div>

                <div class="inputs">
                    <label for="sobre">Sobre:</label>
                    <textarea id="sobre"></textarea>
                </div>
                
            </section>
            
            <h2>Endereço</h2>

            <section class="address">
                
                <div class="inputs">
                    <label for="cep">CEP:</label>
                    <input id="cep" type="text" required>
                </div>

                <div class="inputs">
                    <label for="estado">Estado:</label>
                    <input id="estado" type="text" required>
                </div>
                    
                <div class="inputs">
                    <label for="rua">Rua:</label>
                    <input id="rua" type="text" required>
                </div>
                    
                <div class="inputs">
                    <label for="cidade">Cidade:</label>
                    <input id="cidade" type="text" required>
                </div>

                <div class="rua-grid">
                    <div class="inputs">
                        <label for="numero">Número:</label>
                        <input id="numero" type="text" required>
                    </div>

                    <div class="inputs">
                        <label for="complemento">Complemento:</label>
                        <input id="complemento" type="text" required>
                    </div>
                </div>

                <div class="inputs">
                    <label for="bairro">Bairro:</label>
                    <input id="bairro" type="text" required>
                </div>
            </section>
        </div>

        <div class="buttons">
            <a href="/src/pages/perfil/perfilE&F.html">
                <button type="button" class="btn btn-light">Voltar</button>
            </a>
            <button class="btn btn-dark" type="submit" id="btn-salvar"  onclick="enviarDadosParaOBackendEditar(event)">Salvar Perfil</button>
        </div> 

    </form>

    <script src="/src/pages/perfil/editarPerfil.js"></script>
    <script src="/src/componentes/navbar/navbar.js"></script>
    <script>carregarNavbarHomeEmpresa();</script>
</body>
</html>
